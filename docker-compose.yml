# docker-compose.yml
version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: sentinelfraud_pg
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
      POSTGRES_DB: sentinelfraud
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: